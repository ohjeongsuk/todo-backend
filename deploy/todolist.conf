# ==============================================================================
# 운영 서버 비-비밀 설정 (systemd EnvironmentFile)
#
# 배치 위치: /etc/todolist/todolist.conf
#
# 비밀이 없으므로 이 파일은 git으로 추적한다. 비밀번호·시크릿은 같은 디렉터리의
# todolist.env 에 두고, 그 파일은 커밋하지 않는다. systemd 는 EnvironmentFile 을
# 여러 개 선언할 수 있어 두 파일이 런타임에 합쳐진다.
#
# ------------------------------------------------------------------------------
# 문법 주의 (systemd EnvironmentFile 은 셸 스크립트가 아니다)
#   - KEY=VALUE 한 줄에 하나. 값에 공백이 있어도 따옴표 없이 그대로 쓴다.
#   - export 를 붙이지 않는다. $변수 치환·명령 치환이 동작하지 않는다.
#   - '#' 은 줄 맨 앞에서만 주석이다. 값 뒤에 붙이면 값의 일부가 된다.
# ==============================================================================

# ------------------------------------------------------------------------------
# 프로파일
#
# application.properties 의 spring.profiles.active 기본값이 local 로 하드코딩돼 있다.
# 이 줄이 없으면 운영 서버가 로컬 프로파일로 뜬다 (ddl-auto=update 로 운영 DB 스키마가
# 변경될 수 있다). 환경변수가 properties 파일보다 우선순위가 높아 여기서 덮어쓴다.
# ------------------------------------------------------------------------------
SPRING_PROFILES_ACTIVE=prod

# 8080 은 외부에 열지 않는다. 2단계에서 nginx 가 80/443 을 받아 여기로 프록시한다.
SERVER_PORT=8080

# ------------------------------------------------------------------------------
# JVM 메모리 (t3.micro / RAM 1GB)
#
# -Xmx512m 은 "JVM 이 512MB 만 쓴다"는 뜻이 아니다. 힙 밖의 메타스페이스·코드캐시·
# 스레드 스택·GC 구조체가 200~300MB 를 더 쓴다. 1GB 인스턴스에서 이 합계가 물리 메모리를
# 넘기면 커널 OOM Killer 가 자바 프로세스를 죽인다. 그래서
#   1) 힙 밖 영역에도 상한을 건다 (MaxMetaspaceSize / ReservedCodeCacheSize)
#   2) install.sh 가 스왑 2GB 를 만든다 (Amazon Linux 는 스왑이 없다)
# 두 가지를 함께 한다.
#
# GC 는 SerialGC 로 고정한다. vCPU 2개·1GB 환경에서는 G1 의 동시 스레드 오버헤드가
# 이득보다 크다. 이 크기의 힙에서는 SerialGC 의 정지 시간이 문제 되지 않는다.
#
# UTC 고정은 CLAUDE.md 공통 컨벤션이다. 서버 로컬 타임존이 무엇이든 영향받지 않게 한다.
# ------------------------------------------------------------------------------
JAVA_OPTS=-Xms256m -Xmx512m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=96m -XX:+UseSerialGC -Duser.timezone=UTC -XX:+ExitOnOutOfMemoryError

# ------------------------------------------------------------------------------
# 데이터베이스 (RDS)
#
# 접속 URL 은 아래 3개로 조립된다. jdbc: 로 시작하는 통짜 URL 을 넣는 변수는 없다.
# DB_HOST 에는 호스트명만 넣는다 (포트·스킴·DB명 제외).
# 계정·비밀번호는 todolist.env 에 있다.
# ------------------------------------------------------------------------------
DB_HOST=todolistdb.crky6o6msmdm.ap-northeast-2.rds.amazonaws.com
DB_PORT=5432
DB_NAME=todolist_db

# ------------------------------------------------------------------------------
# CORS / 프론트엔드
#
# 단수형 CORS_ALLOWED_ORIGIN 이다. 복수형은 코드가 읽지 않는다.
# 쿠키를 쓰므로 와일드카드(*)는 사용할 수 없다 (CLAUDE.md 5장).
#
# FRONTEND_URL 은 비밀번호 재설정 링크와 Google OAuth2 콜백의 기준 주소다.
# 콜백은 {FRONTEND_URL}/oauth/callback 으로 코드가 조립한다.
# ------------------------------------------------------------------------------
CORS_ALLOWED_ORIGIN=https://main.d1prwks7k0qzzg.amplifyapp.com
FRONTEND_URL=https://main.d1prwks7k0qzzg.amplifyapp.com

# ------------------------------------------------------------------------------
# Refresh Token 쿠키 정책 — [2단계 완료] 재정의를 제거했다
#
# 1단계에는 EC2 IP + HTTP 로 기동했기 때문에 Secure 쿠키가 브라우저에서 거부됐고,
# 그래서 여기서 Lax/false 로 내려두고 있었다.
#
# 지금은 CloudFront(d1ohmep7p8olsq.cloudfront.net)가 백엔드 앞에서 TLS 를 종료하므로
# 브라우저와 API 사이가 HTTPS 다. nginx + Let's Encrypt 는 도입하지 않았다.
# 따라서 재정의 두 줄을 지워 application-prod.properties 의 기본값으로 되돌린다:
#   refresh-token-cookie.same-site=None
#   refresh-token-cookie.secure=true
# cross-site(Amplify <-> CloudFront) 조합에는 SameSite=None; Secure 가 필수다.
#
# 되돌려야 하면 아래 두 줄을 다시 넣는다. jar 재빌드는 필요 없다.
#   REFRESH_COOKIE_SAME_SITE=Lax
#   REFRESH_COOKIE_SECURE=false
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# AWS S3 (첨부 이미지 저장소)
#
# 자격증명(AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY)은 여기에 적지 않는다.
# EC2 인스턴스 프로파일에 붙인 IAM Role 을 DefaultCredentialsProvider 가 IMDS 에서
# 자동으로 가져간다 (CLAUDE.md 절대 규칙 9). 키를 서버에 두지 않는 것이 목적이다.
# ------------------------------------------------------------------------------
AWS_REGION=ap-northeast-2
AWS_S3_BUCKET=todolist-dev-ojs933327
