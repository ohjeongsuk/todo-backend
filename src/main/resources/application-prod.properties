# ==============================================================================
# 운영 프로파일 설정
#
# 모든 값은 환경변수로 주입한다 (CLAUDE.md 절대 규칙 9). 이 파일 자체에는
# 비밀 정보를 두지 않으므로 git 추적 대상이어도 안전하다.
#
# 값에는 ASCII 만 쓴다 (application.properties 머리말의 ISO-8859-1 규칙 참고).
# ==============================================================================

# 운영에서는 스키마를 자동 변경하지 않는다. 스키마는 사전에 검토 후 수동 적용한다.
# 최초 1회는 db/schema.sql 을, 이후 변경은 db/*.sql 스크립트를 수동 실행한다.
# validate 이므로 스키마가 없으면 기동이 실패한다 - 이는 방어 장치이지 버그가 아니다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ==============================================================================
# 서버 포트
#
# systemd EnvironmentFile(todolist.conf)에서 SERVER_PORT 로 덮어쓸 수 있게 열어둔다.
# 8080 은 외부에 직접 열지 않고 nginx 리버스 프록시가 앞에 선다 (ROADMAP 11-3).
# ==============================================================================
server.port=${SERVER_PORT:8080}

# ==============================================================================
# 헬스체크 (ROADMAP 11-2)
#
# health 하나만 노출한다. env / beans / configprops / heapdump 등이 열리면 환경변수와
# 빈 구성이 그대로 새어나간다. show-details=never 이므로 응답은 {"status":"UP"} 뿐이고
# 어떤 컴포넌트가 왜 DOWN 인지는 노출되지 않는다 - 원인은 서버 로그에서 확인한다.
# ==============================================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.level.org.hibernate=warn
logging.level.org.hibernate.SQL=warn

cors.allowed-origin=${CORS_ALLOWED_ORIGIN}

# 운영은 프론트(Amplify)와 백엔드(EC2)가 cross-site이므로 SameSite=None; Secure가 필요하다
# (CLAUDE.md 5장). 로컬은 application.properties 기본값(Lax)을 그대로 쓴다.
#
# 기본값을 None/true 로 두되 환경변수로 덮어쓸 수 있게 한다. 배포 1단계는 도메인 없이 HTTP로
# 기동해 헬스체크·Swagger 까지만 검증하는데, 그 구간에서는 Secure 쿠키가 브라우저에서 거부되기
# 때문이다. todolist.conf 에서 Lax/false 로 내려두고, HTTPS 전환(ROADMAP 11-3) 시 그 두 줄만
# 지우면 여기 기본값으로 자동 복귀한다. jar 재빌드가 필요 없다.
refresh-token-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:None}
refresh-token-cookie.secure=${REFRESH_COOKIE_SECURE:true}

# ==============================================================================
# 리버스 프록시 (ROADMAP 11-3에서 활성화)
#
# nginx가 TLS를 종료하고 백엔드에는 평문 HTTP로 전달하므로, 이 설정이 없으면 Spring이 모든
# 요청을 http로 인식한다. 그러면 Google OAuth2 리다이렉트 URI가 http로 조립돼 구글 콘솔에
# 등록한 https 값과 불일치하고 콜백이 실패한다.
#
# nginx 앞단이 없는 지금 켜면 클라이언트가 보낸 X-Forwarded-* 헤더를 그대로 신뢰하게 되므로
# 아직 켜지 않는다. nginx 도입과 동시에 주석을 푼다.
# server.forward-headers-strategy=framework

# ==============================================================================
# 첨부 스토리지 (S3) - PRD F-50, ROADMAP Phase 13
#
# AWS 자격증명은 여기에 없다. IAM Role(DefaultCredentialsProvider)이 처리한다
# (CLAUDE.md 절대 규칙 9). signing-secret 은 jwt.secret 과 반드시 다른 값을 쓴다.
# HS256 서명 키라서 32바이트(32자) 이상이어야 한다.
# ==============================================================================
app.storage.type=s3
app.storage.s3.bucket=${AWS_S3_BUCKET}
app.storage.s3.region=${AWS_REGION:ap-northeast-2}
app.storage.url-expiry-minutes=30
app.storage.signing-secret=${STORAGE_SIGNING_SECRET}
