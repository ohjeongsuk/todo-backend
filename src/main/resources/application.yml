spring:
  application:
    name: todo-backend
  profiles:
    active: local

  # ==============================================================================
  # 데이터베이스 (PostgreSQL)
  #
  # 비밀 정보는 코드에 하드코딩하지 않는다 (CLAUDE.md 절대 규칙 9).
  # 실제 접속 정보는 application-local.yml 또는 환경변수로 주입한다.
  # 로컬 실행 예시는 application-local.yml.example 을 참고한다.
  # ==============================================================================
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:todolist_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # ==============================================================================
  # JPA / Hibernate
  # ==============================================================================
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # 시간대: 서버와 DB 모두 UTC 로 저장한다 (CLAUDE.md 공통 컨벤션)
        jdbc:
          time_zone: UTC

  # ==============================================================================
  # Google OAuth2 (ROADMAP Phase 5)
  #
  # provider 블록은 두지 않는다 — "google"은 Spring Security가 내장 프리셋으로
  # 인증/토큰/사용자정보 엔드포인트를 이미 알고 있다. client-id/secret만 채우면 된다.
  # 리다이렉트 URI는 기본값(/login/oauth2/code/{registrationId})을 그대로 쓴다.
  # ==============================================================================
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile

logging:
  level:
    org.hibernate: info
    org.hibernate.SQL: debug

# ==============================================================================
# 인증 (JWT / Refresh Token / 비밀번호 재설정 토큰)
#
# 시크릿은 코드에 하드코딩하지 않는다 (CLAUDE.md 절대 규칙 9). JWT_SECRET은 반드시
# 환경변수로 주입한다 (기본값 없음 — 없으면 기동 실패해야 안전하다).
# ==============================================================================
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000 # 30분 (ms) — CLAUDE.md 5장

refresh-token:
  expiration-days: 14 # CLAUDE.md 5장

password-reset-token:
  expiration-minutes: 30 # PRD F-43

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}

# 비밀번호 재설정 링크·OAuth 콜백(Phase 5) 리다이렉트 대상. cors.allowed-origin과 동일 도메인이다.
frontend:
  url: ${FRONTEND_URL:http://localhost:3000}

# 로컬(localhost:3000 ↔ localhost:8080)은 same-site이므로 Lax로 충분하다 (CLAUDE.md 5장).
# 운영 값은 application-prod.yml에서 None; Secure로 재정의한다.
refresh-token-cookie:
  same-site: Lax
  secure: false
