spring.application.name=todo-backend

# ==============================================================================
# 데이터베이스 (PostgreSQL)
#
# 비밀 정보는 코드에 하드코딩하지 않는다 (CLAUDE.md 절대 규칙 9).
# 실제 접속 정보는 application-local.properties 또는 환경변수로 주입한다.
# 로컬 실행 예시는 application-local.properties.example 을 참고한다.
# ==============================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:todolist_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ==============================================================================
# JPA / Hibernate
# ==============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate=info
logging.level.org.hibernate.SQL=debug

# ==============================================================================
# 시간대: 서버와 DB 모두 UTC 로 저장한다 (CLAUDE.md 공통 컨벤션)
# ==============================================================================
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
