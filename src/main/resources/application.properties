spring.application.name=todo-backend
spring.profiles.active=local

# ==============================================================================
# .properties 파일 작성 규칙 (중요)
#
# Spring Boot 는 .properties 를 ISO-8859-1 로 읽는다. [encoding=utf-8] 속성은
# spring.config.import 전용이며 이 파일에는 적용되지 않는다. 따라서:
#   - 값(value)에는 ASCII 만 쓴다. 한글 값을 넣으면 깨진다.
#   - 한글은 이렇게 주석에만 둔다. 주석 줄은 파서가 통째로 버리므로 안전하다.
#
# 또한 '#' 은 줄 맨 앞에서만 주석이다. YAML 과 달리 값 뒤에 붙이면 값의 일부가 된다.
#   잘못:  jwt.access-token-expiration=1800000 # 30분
#   올바름: 주석을 앞줄로 올린다
# ==============================================================================

# ==============================================================================
# 데이터베이스 (PostgreSQL)
#
# 비밀 정보는 코드에 하드코딩하지 않는다 (CLAUDE.md 절대 규칙 9).
# 실제 접속 정보는 application-local.properties 또는 환경변수로 주입한다.
# 로컬 실행 예시는 application-local.properties.example 을 참고한다.
# ==============================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:todolist_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ==============================================================================
# JPA / Hibernate
# ==============================================================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# 시간대: 서버와 DB 모두 UTC 로 저장한다 (CLAUDE.md 공통 컨벤션)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ==============================================================================
# Google OAuth2 (ROADMAP Phase 5)
#
# provider 블록은 두지 않는다 - "google"은 Spring Security가 내장 프리셋으로
# 인증/토큰/사용자정보 엔드포인트를 이미 알고 있다. client-id/secret만 채우면 된다.
# 리다이렉트 URI는 기본값(/login/oauth2/code/{registrationId})을 그대로 쓴다.
# ==============================================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

logging.level.org.hibernate=info
logging.level.org.hibernate.SQL=debug

# ==============================================================================
# 인증 (JWT / Refresh Token / 비밀번호 재설정 토큰)
#
# 시크릿은 코드에 하드코딩하지 않는다 (CLAUDE.md 절대 규칙 9). JWT_SECRET은 반드시
# 환경변수로 주입한다 (기본값 없음 - 없으면 기동 실패해야 안전하다).
# ==============================================================================
jwt.secret=${JWT_SECRET}
# 30분 (ms) - CLAUDE.md 5장
jwt.access-token-expiration=1800000

# CLAUDE.md 5장
refresh-token.expiration-days=14

# PRD F-43
password-reset-token.expiration-minutes=30

cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

# 비밀번호 재설정 링크·OAuth 콜백(Phase 5) 리다이렉트 대상. cors.allowed-origin과 동일 도메인이다.
frontend.url=${FRONTEND_URL:http://localhost:3000}

# 로컬(localhost:3000 <-> localhost:8080)은 same-site이므로 Lax로 충분하다 (CLAUDE.md 5장).
# 운영 값은 application-prod.properties에서 None; Secure로 재정의한다.
refresh-token-cookie.same-site=Lax
refresh-token-cookie.secure=false

# ==============================================================================
# 첨부 파일 업로드 (PRD F-46 ~ F-51)
#
# image/svg+xml 은 넣지 않는다. SVG 는 스크립트를 실행할 수 있어 XSS 벡터다 (PRD F-47).
#
# 크기 제한은 애플리케이션에서 이중 방어한다 (PRD NF-34).
# server.tomcat.max-swallow-size 는 여기에 쓰지 않는다 - 중단된 요청의 잔여 본문을
# 서버가 버리는 양이지 업로드 상한이 아니어서 오해를 부른다.
# ==============================================================================
# 5MB
app.upload.max-file-size=5242880
app.upload.allowed-content-types=image/jpeg,image/png,image/gif,image/webp
