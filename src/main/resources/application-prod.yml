# ==============================================================================
# 운영 프로파일 설정
#
# 모든 값은 환경변수로 주입한다 (CLAUDE.md 절대 규칙 9). 이 파일 자체에는
# 비밀 정보를 두지 않으므로 git 추적 대상이어도 안전하다.
# ==============================================================================
spring:
  jpa:
    hibernate:
      # 운영에서는 스키마를 자동 변경하지 않는다. 스키마는 사전에 검토 후 수동 적용한다.
      ddl-auto: validate
    show-sql: false

logging:
  level:
    org.hibernate: warn
    org.hibernate.SQL: warn

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN}

# 운영은 프론트(Amplify)와 백엔드(EC2)가 cross-site이므로 SameSite=None; Secure가 필요하다
# (CLAUDE.md 5장). 로컬은 application.yml 기본값(Lax)을 그대로 쓴다.
refresh-token-cookie:
  same-site: None
  secure: true
